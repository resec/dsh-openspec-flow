name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: node-pin
        shell: bash
        run: |
          version=$(node -p 'require("./coverage.baseline.json").node.version.replace(/^v/, "")')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
          cache: npm
      - run: npm ci
      - name: change check
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          arguments=(--base "$PR_BASE_SHA" --head "$PR_HEAD_SHA")
          if [ "$PR_AUTHOR" = "resec" ] && [ "$PR_HEAD_REPO" = "$REPOSITORY" ]; then
            arguments+=(--maintainer)
          fi
          node scripts/check-pr-change.mjs "${arguments[@]}"
      - name: generated skill check
        if: github.event_name == 'pull_request'
        run: node scripts/check-generated-skills.mjs --base "${{ github.event.pull_request.base.sha }}"
      - run: npm run openspec:check
      - run: npm run check:requirement-length
      - run: npm run verify

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/lab/pw-browsers
    steps:
      - uses: actions/checkout@v7
      - id: node-pin
        shell: bash
        run: |
          version=$(node -p 'require("./coverage.baseline.json").node.version.replace(/^v/, "")')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-pin.outputs.version }}
          cache: npm
      - name: install pnpm for DSH plugin installs
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - run: npm ci
      - name: point the lab at the setup-node cache
        run: echo "OPENSPEC_FLOW_NPM_CACHE=$HOME/.npm" >> "$GITHUB_ENV"
      - name: install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - uses: actions/cache@v6
        with:
          path: .cache/lab/pw-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v6
        with:
          path: .cache/lab/dsh
          key: ${{ runner.os }}-dsh-${{ hashFiles('package.json') }}
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run lab -- doctor
      - run: npm run test:lab -- --mock-only
